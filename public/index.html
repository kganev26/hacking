<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Sign Up / Log In</h2>
        <form id="authForm" action="/login" method="POST">
            <label>Username</label>
            <input type="text" name="username" required>
            
            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" id="submitBtn">Log In</button>
            <p>Need an account? <a href="#" onclick="toggleMode()">Register here</a></p>
        </form>
    </div>

    <script>
        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            const form = document.getElementById('authForm');
            const btn = document.getElementById('submitBtn');
            form.action = isLogin ? '/login' : '/register';
            btn.innerText = isLogin ? 'Log In' : 'Register';
        }
    </script>
</body>
</html>
